<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer 教练｜求职差距分析</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Offer 教练</h1>
    <p class="site-sub">看清岗位要求，找出你的差距</p>
    <nav class="site-nav">
      <span class="nav-item is-active">首页</span>
      <a class="nav-item" href="profile.html">我的进度</a>
      <a class="nav-item" href="analyze.html">差距分析</a>
    </nav>
  </header>

  <main class="main">
    <section class="intro">
      <p>下面是本期收录的 8 个技术岗位。点进任一岗位，查看它需要哪些技能并勾选你已掌握的。</p>
    </section>

    <!-- Day 12：岗位筛选框（输入即筛，见 skills/frontend-guidelines 三态规范） -->
    <section class="filter-bar" aria-label="岗位筛选">
      <input type="search" id="job-filter" class="filter-input"
             placeholder="输入岗位名或关键词筛选，如：前端、数据、安全…"
             autocomplete="off">
      <p id="filter-status" class="filter-status" aria-live="polite"></p>
    </section>

    <!-- 岗位卡片由 js/app.js 渲染；数据由 js/data.js 从云函数接口取回（Day 17 板块⑤）
         下面是加载态占位：数据就绪后会被替换成卡片（或空态 / 错误态） -->
    <section id="job-list" class="job-grid" aria-label="岗位清单">
      <p class="state-tip state-loading">正在加载岗位数据…</p>
    </section>

    <noscript>
      <p class="noscript-tip">本页面需要开启 JavaScript 才能显示岗位清单。</p>
    </noscript>
  </main>

  <footer class="site-footer">offer-coach · 求职差距分析 · v1.0</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
